name: CI - FoodLink

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Compilar e testar (Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar e rodar os testes (12 testes)
        run: mvn -B clean test

      - name: Empacotar o jar executável
        run: mvn -B -DskipTests package

      - name: Guardar o artefato
        uses: actions/upload-artifact@v4
        with:
          name: foodlink-jar
          path: target/foodlink.jar
